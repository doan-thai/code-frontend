<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/images/favicon-32x32.png" type="img/png" size="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <main>
    <div class="result-card">
      <h2 class="heading result">Your Result</h2>
      <div class="result-circle">
        76
        <span class="circle max-score"> of 100</span>
      </div>

      <h1 class="result-rating">Great</h1>
      <p class="result-describe">You scored higher than 65% of the people who have taken these tests.</p>

    </div>

    <div class="summary-card">
      <h2 class="heading summary">Summary</h2>

      <div class="summary-card-items reaction">
        <div class="summary-card-box reaction">
          <img src="./assets/images/icon-reaction.svg" alt="Icon reaction" class="summary-icon-reaction">
          <p class="summary-items-name reaction">Reaction</p>
        </div>

        <p class="summary-items-score">80 <span class="summary max-score">/ 100</span></p>
      </div>

      <div class="summary-card-items memory">
        <div class="summary-card-box memory">
          <img src="./assets/images/icon-memory.svg" alt="Icon memory" class="summary-icon-memory">
          <p class="summary-items-name memory">Memory</p>
        </div>
        <p class="summary-items-score">92 <span class="summary max-score">/ 100</span></p>
      </div>

      <div class="summary-card-items verbal">
        <div class="summary-card-box verbal">
          <img src="./assets/images/icon-verbal.svg" alt="Icon verbal" class="summary-icon-verbal">
          <p class="summary-items-name verbal">Verbal</p>
        </div>
        <p class="summary-items-score">61 <span class="summary max-score">/ 100</span></p>
      </div>

      <div class="summary-card-items visual">
        <div class="summary-card-box visual">
          <img src="./assets/images/icon-visual.svg" alt="Icon visual" class="summary-icon-visual">
          <p class="summary-items-name visual">Visual</p>
        </div>
        <p class="summary-items-score">73 <span class="summary max-score">/ 100</span></p>
      </div>

      <div class="summary-card-continue">
        <p class="summary-card-continue-text">Continue</p>
      </div>

    </div>

  </main>
  
</body>
</html>
